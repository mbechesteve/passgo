<div class="boot" id="boot" role="status" aria-live="polite">
  <div class="boot-mark">
    <!-- peakGlyphPath(160, 104) from src/utils/peaks.ts — Nelion, the Gate of the
         Mists, then Batian, the highest point, which is why nothing sits above it. -->
    <svg width="160" height="104" viewBox="0 0 160 104" fill="none" aria-hidden="true">
      <path class="boot-track" pathLength="100" stroke-width="2.5" stroke-linecap="round"
            stroke-linejoin="round" d="M 0,104 L 67.2,11.96 L 78.4,35.98 L 89.6,0 L 160,104"/>
      <path class="boot-ridge" pathLength="100" stroke-width="2.5" stroke-linecap="round"
            stroke-linejoin="round" d="M 0,104 L 67.2,11.96 L 78.4,35.98 L 89.6,0 L 160,104"/>
    </svg>
    <p class="boot-word">Pamoja</p>
    <p class="boot-sub mono">Loading the fan pass</p>
  </div>
</div>


<nav class="nav" aria-label="Main">
  <input class="menu-toggle" type="checkbox" id="menu">

    <label class="burger" for="menu" aria-label="Open the menu">&#8801;</label>
  </div>
</nav>

<main class="appmain" id="page">
  <div class="dash-head">
    <div>
      <p class="eyebrow mono" id="clock"></p>
      <h1 id="greeting"></h1>
    </div>
    <span class="pill-tag" id="validity"></span>
  </div>

  <section class="panel" aria-labelledby="cred-h">
    <h2 id="cred-h">Your Pass</h2>
    <dl class="credential" id="credential"></dl>
    <button class="btn" id="open-wallet">Wallet and payment method</button>
  </section>

  <section class="panel" aria-labelledby="rec-h">
    <h2 id="rec-h">Your record</h2>
    <ul class="rowline" id="record"></ul>
    <p class="muted" id="record-totals"></p>
  </section>
</main>

<nav class="tabbar"></nav>

<dialog class="sheet" id="wallet">
  <div class="sheet-head">
    <h2>Wallet</h2>
    <button class="sheet-close" aria-label="Close">&times;</button>
  </div>
  <div class="sheet-body">
    <p class="muted">The default method is the one offered first at a counter.</p>
    <ul class="rowline" id="wallet-list"></ul>

    <!-- Adding a method: the app's PaymentMethodScreen fields, and no others — which
         kind, and the number. Every label here is written by pages/pass.js out of the
         bundle's own strings, so the wording is the app's rather than a second copy
         of it, and the kinds come from `KINDS` rather than being typed out.

         This captures no payment and funds nothing (Rev. 2 §05). The number is read
         once, handed to usePaymentStore.add, and dropped: only the digit tail is ever
         stored, and the field is cleared rather than echoed back. It carries no `name`
         and the form never submits, so it cannot leave the page even by accident. -->
    <form id="add-method" autocomplete="off" style="margin-top:20px">
      <fieldset id="method-kinds" style="border:0;padding:0;margin:0">
        <legend class="eyebrow mono" id="kind-heading"></legend>
      </fieldset>
      <label for="method-number" id="number-heading" style="display:block;margin-top:14px"></label>
      <input id="method-number" class="full-control" type="text" inputmode="numeric" autocomplete="off">
      <!-- 11px is --fs-micro's own value; the token in place of the literal it happened
           to match. -->
      <p class="muted mono" id="number-note" style="font-size:var(--fs-micro)"></p>
      <!-- .btn already sets min-height: 44px; the inline style repeating it was a no-op. -->
      <button class="btn" id="save-method" type="submit"></button>
    </form>
  </div>
</dialog>

<script src="app-data.js"></script>
<script src="state.js"></script>
<script src="chrome.js"></script>
<script src="pages/pass.js"></script>
<script src="boot.js"></script>

</body>
</html>
