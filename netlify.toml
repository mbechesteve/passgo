[build]
  command = "expo export --platform web"
  publish = "dist"

# SPA fallback — serve index.html for any route the static files don't match,
# so deep links and page refreshes don't 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/_expo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
