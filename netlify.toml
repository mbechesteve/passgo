[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback, scoped to the app. The portal owns the domain root and is made of
# real files, so it needs no fallback — and must not have one, or a mistyped URL
# would quietly render the marketing page instead of 404ing.
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

[[headers]]
  for = "/app/_expo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
